<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Register | Complaint System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

  <div class="auth-box">
    <h2>Admin Register</h2>

    <form>
      <label>Admin Name</label>
      <input type="text" placeholder="Enter admin name" />

      <label>Email</label>
      <input type="email" placeholder="Enter admin email" />

      <label>Department</label>
      <input type="text" placeholder="Enter department name" />

      <label>Admin Code</label>
      <input type="password" placeholder="Enter secret admin code" />

      <label>Password</label>
      <input type="password" placeholder="Create password" />

      <label>Confirm Password</label>
      <input type="password" placeholder="Confirm password" />

      <button type="submit">Register as Admin</button>
    </form>

    <p><a href="login.html">Back to Login</a></p>
  </div>

</body>
</html>
